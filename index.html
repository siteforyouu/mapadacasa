<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Casa 3D</title>
<style>
:root{--bg:#0e0d0c;--fg:#f4efe6;--ac:#f0a35e;--pn:rgba(18,16,14,.8);--bd:rgba(255,255,255,.16);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:flex;align-items:center;transition:opacity .7s ease,transform .7s ease,visibility .7s;z-index:5}
.scr.off{opacity:0;transform:scale(1.04);pointer-events:none;visibility:hidden}
#intro{background:linear-gradient(90deg,rgba(8,7,6,.82),rgba(8,7,6,.15) 60%,transparent);padding:0 6vw}
#pause,#settings,#map{justify-content:center;background:rgba(8,7,6,.62);backdrop-filter:blur(6px);z-index:8}#settings,#map{z-index:9}
.box{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:18px;padding:22px;backdrop-filter:blur(10px);max-width:min(560px,92vw);align-items:stretch}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(40px,8vw,76px);margin:0;line-height:1;letter-spacing:-.02em}
h2{margin:0 0 4px;font-weight:600}small.k{letter-spacing:.3em;text-transform:uppercase;color:var(--ac);font-size:11px}
p{margin:0 0 6px;opacity:.8;font-size:14px;line-height:1.5}
button{font:inherit;font-size:15px;color:var(--fg);background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:12px;padding:13px 18px;cursor:pointer;text-align:left;transition:background .25s,transform .2s,border-color .25s}
button:hover{background:rgba(255,255,255,.16);transform:translateX(4px);border-color:var(--ac)}button:active{transform:scale(.97)}
button.pri{background:var(--ac);color:#1b1208;font-weight:700;border-color:var(--ac)}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}input[type=range]{accent-color:var(--ac);width:55%}select{background:#222;color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:5px}
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .6s;z-index:3}#hud.off{opacity:0}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#fff;opacity:.7;box-shadow:0 0 0 1px #0006}
#prompt{position:absolute;left:50%;top:58%;transform:translate(-50%,6px);background:var(--pn);border:1px solid var(--bd);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap}#prompt.on{opacity:1;transform:translate(-50%,0)}
#rn{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:Georgia,serif;font-size:clamp(24px,4vw,40px);text-shadow:0 2px 12px #000;opacity:0;transition:opacity .8s;white-space:nowrap}

#mc{width:100%;border-radius:12px;background:#15130f}
#js{position:fixed;width:90px;height:90px;margin:-45px;border:2px solid var(--bd);border-radius:50%;display:none;z-index:4;pointer-events:none}

<canvas id="c"></canvas>
<div id="hud" class="off"><div id="cross"></div><div id="prompt"></div><div id="rn"></div><div id="hint"></div><button id="bp" data-a="pause">⏸</button></div>
<div id="js"></div>
<div id="intro" class="scr"><div class="box"><small class="k">Casa Aurora · experiência 3D</small><h1>Minha Casa</h1><p>Explore em primeira pessoa uma casa moderna com jardim, garagem e um bunker escondido. Abra portas, acenda luzes e descubra os segredos.</p>
<button class="pri" data-a="enter">🚪 Entrar na casa</button><button data-a="ext">🌳 Explorar o exterior</button><button data-a="map">🗺️ Visualizar o mapa</button><button data-a="set">⚙️ Configurações</button></div></div>
<div id="pause" class="scr off"><div class="box card"><h2>Pausado</h2><button class="pri" data-a="resume">▶ Continuar</button><button data-a="map">🗺️ Mapa</button><button data-a="set">⚙️ Configurações</button><button data-a="intro">🏠 Menu inicial</button></div></div>
<div id="settings" class="scr off"><div class="box card"><h2>Configurações</h2>
<label>Sensibilidade do mouse <input type="range" id="s_sens" min=".3" max="2.5" step=".05" value="1"></label>
<label>Campo de visão <input type="range" id="s_fov" min="55" max="100" value="72"></label>
<label>Volume <input type="range" id="s_vol" min="0" max="1" step=".05" value=".6"></label>
<label>Balanço da câmera ao andar <input type="checkbox" id="s_bob" checked></label>
<label>Sombras <input type="checkbox" id="s_sh" checked></label>
<label>Qualidade <select id="s_q"><option value="1">Alta</option><option value=".7">Média</option><option value=".5">Baixa</option></select></label>
<button class="pri" data-a="back">Voltar</button></div></div>
<div id="map" class="scr off"><div class="box card" style="max-width:min(640px,94vw)"><h2>Mapa da casa</h2><canvas id="mc" width="560" height="380"></canvas><p>O ponto laranja é você. Há mais coisas na casa do que o mapa mostra…</p><button class="pri" data-a="back">Fechar</button></div></div>
<div id="extbar" class="off"><button data-a="enter">🚪 Entrar na casa</button><button data-a="intro">☰ Menu</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,sm=t=>t*t*(3-2*t);
const S={sens:1,fov:72,vol:.6,bob:true,sh:true,q:1};
const cv=$('c'),rd=new THREE.WebGLRenderer({canvas:cv,antialias:true});rd.shadowMap.enabled=true;rd.shadowMap.type=THREE.PCFSoftShadowMap;
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(72,1,.05,300);cam.rotation.order='YXZ';
const skyC=new THREE.Color(0xbcd8ee),darkC=new THREE.Color(0x050505);sc.background=skyC.clone();sc.fog=new THREE.Fog(0xbcd8ee,45,120);
const hemi=new THREE.HemisphereLight(0xffffff,0x6b6a58,.85);sc.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1d6,1.05);sun.position.set(14,26,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-24,right:24,top:24,bottom:-24,near:1,far:70});sun.shadow.bias=-.0004;sc.add(sun);

// ===== áudio sintetizado =====
let AC;const AU=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.state==='suspended'&&AC.resume()}catch(e){}return AC};
function nz(d,f0,f1,v,q=1){const a=AU();if(!a||!S.vol)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime;s.buffer=b;f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.value=v*S.vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}

const SND={door:()=>{nz(.55,420,110,.55,2);tn(80,.3,.3)},click:()=>{tn(1500,.04,.18,'square');nz(.05,3000,1500,.2)},step:()=>nz(.1,600,180,.2),slide:()=>{nz(1.4,220,80,.45)},garage:()=>{nz(2.2,160,70,.4)},tv:()=>tn(220,.2,.12,'sawtooth')};

// ===== texturas procedurais =====

const TXG={
wood:(g,w,h)=>{g.fillStyle='#b98a58';g.fillRect(0,0,w,h);const n=8,p=h/n;for(let i=0;i<n;i++){g.fillStyle=`hsl(${28+Math.random()*6},${42+Math.random()*10}%,${40+Math.random()*14}%)`;g.fillRect(0,i*p,w,p-2);for(let k=0;k<12;k++){g.strokeStyle='rgba(60,35,15,.2)';g.beginPath();const y=i*p+Math.random()*p;g.moveTo(0,y);g.lineTo(w,y+Math.random()*4-2);g.stroke()}g.fillStyle='rgba(40,25,10,.55)';g.fillRect(0,i*p+p-2,w,2);g.fillRect(Math.random()*w,i*p,2,p)}},
tile:(g,w,h)=>{g.fillStyle='#e8e5de';g.fillRect(0,0,w,h);for(let i=0;i<4;i++)for(let j=0;j<4;j++){g.fillStyle=`rgba(${Math.random()*30},${Math.random()*30},${Math.random()*30},.07)`;g.fillRect(i*w/4,j*h/4,w/4,h/4)}g.strokeStyle='#bdb8ad';g.lineWidth=3;for(let i=0;i<=4;i++){g.beginPath();g.moveTo(i*w/4,0);g.lineTo(i*w/4,h);g.moveTo(0,i*h/4);g.lineTo(w,i*h/4);g.stroke()}},
marble:(g,w,h)=>{g.fillStyle='#f2f1ee';g.fillRect(0,0,w,h);for(let i=0;i<16;i++){g.strokeStyle=`rgba(110,110,125,${.1+Math.random()*.25})`;g.lineWidth=.5+Math.random()*2;g.beginPath();g.moveTo(Math.random()*w,0);g.bezierCurveTo(Math.random()*w,h*.3,Math.random()*w,h*.6,Math.random()*w,h);g.stroke()}},
conc:(g,w,h)=>{g.fillStyle='#8d8c88';g.fillRect(0,0,w,h);spk(g,w,h,900,()=>`rgba(${Math.random()*255|0},${Math.random()*255|0},${Math.random()*255|0},.06)`);g.strokeStyle='#6f6e6a';g.strokeRect(0,0,w,h)},
grass:(g,w,h)=>{g.fillStyle='#4b8a3a';g.fillRect(0,0,w,h);spk(g,w,h,2200,()=>`hsl(${90+Math.random()*30},${40+Math.random()*25}%,${25+Math.random()*20}%)`)},
carpet:(g,w,h)=>{g.fillStyle='#b9b2a6';g.fillRect(0,0,w,h);spk(g,w,h,2500,()=>`rgba(${Math.random()*255|0},${Math.random()*255|0},${Math.random()*255|0},.1)`)}};
const TXC={};const tex=k=>TXC[k]||(TXC[k]=ctex(TXG[k]));
const MT=(k,rx,rz,c)=>{const t=tex(k).clone();t.needsUpdate=true;t.repeat.set(rx,rz);return new THREE.MeshStandardMaterial({map:t,color:c||0xffffff,roughness:k==='marble'||k==='tile'?.22:.72})};
const MC={};const mat=m=>m&&m.isMaterial?m:(MC[m]||(MC[m]=new THREE.MeshStandardMaterial({color:m,roughness:.75})));
const MET=new THREE.MeshStandardMaterial({color:0x9a9fa5,metalness:.85,roughness:.35}),glassM=()=>{const m=new THREE.MeshStandardMaterial({color:0xbfe0f0,transparent:true,opacity:.28,roughness:.05,metalness:.2});m.depthWrite=false;return m};
const emis=(c,i=1)=>new THREE.MeshStandardMaterial({color:0x222222,emissive:c,emissiveIntensity:i});

// ===== helpers de geometria =====
const WH=2.8,T=.2,C=[[],[]],doors=[];
function box(w,h,d,m,x,y,z,par,sh=1){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(m));o.position.set(x,y,z);if(sh)o.castShadow=o.receiveShadow=true;(par||sc).add(o);return o}
const grp=(x,z,ry=0,y=0)=>{const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;sc.add(g);return g};
const B=(g,w,h,d,m,x,y,z)=>box(w,h,d,m,x,y+h/2,z,g);
function cyl(g,r,h,m,x,y,z,r2,sg=16){const o=new THREE.Mesh(new THREE.CylinderGeometry(r2??r,r,h,sg),mat(m));o.position.set(x,y+h/2,z);o.castShadow=true;g.add(o);return o}

const col=(l,x0,x1,z0,z1,d)=>C[l].push({x0,x1,z0,z1,d});
function blk(x,z,w,d,ry=0,l=0){if(Math.abs(Math.sin(ry))>.7)[w,d]=[d,w];col(l,x-w/2,x+w/2,z-d/2,z+d/2)}

// ===== cômodos =====
const R=[
['Sala de estar',-7,-1,0,4.5,'wood',0xffffff,[-6.88,3.6,'x']],['Sala de jantar',-1,3,0,4.5,'wood',0xe8d2b8,[2.88,.5,'x']],['Cozinha',3,8,0,4.5,'tile',0xffffff,[3.12,.5,'x']],
['Garagem',8,12.5,0,4.5,'conc',0xffffff,[8.12,.6,'x']],['Quarto 1',-7,-3,-4.5,0,'carpet',0xd8cdbd,[-3.6,-.12,'z']],['Banheiro da suíte',-3,-1,-4.5,0,'marble',0xffffff,[-2.88,-1.4,'x']],
['Corredor',-1,2.5,-2.4,0,'wood',0xd6b996,[-.88,-.6,'x']],['Banheiro social',2.5,4.5,-4.5,0,'tile',0xdfe9e8,[2.62,-.35,'x']],['Quarto 2',4.5,8,-4.5,0,'wood',0xc9d6c0,[5.4,-.12,'z']],
['Passagem secreta',-1,2.5,-4.5,-2.4,'conc',0xffffff,[-.88,-3.3,'x']],['Bunker secreto',-3.5,3.5,-10,-5.3,'conc',0xffffff,[-3.38,-6,'x']]]
.map((a,i)=>({i,n:a[0],x0:a[1],x1:a[2],z0:a[3],z1:a[4],k:a[5],tint:a[6],sw:a[7],lv:i===10?1:0,on:true,b:1,cx:(a[1]+a[2])/2,cz:(a[3]+a[4])/2}));
const roomAt=(x,z,lv)=>R.findIndex(r=>r.lv===lv&&x>=r.x0&&x<=r.x1&&z>=r.z0&&z<=r.z1);
function floor(x0,x1,z0,z1,k,tint,y=0){const w=x1-x0,d=z1-z0;box(w,.2,d,MT(k,w/2,d/2,tint),(x0+x1)/2,y-.1,(z0+z1)/2)}
R.slice(0,9).forEach(r=>{if(r.i!==6)floor(r.x0,r.x1,r.z0,r.z1,r.k,r.tint)});floor(-1,2.5,-2.4,0,'wood',0xd6b996);
floor(-1,.05,-4.5,-2.4,'conc');floor(1.45,2.5,-4.5,-2.4,'conc');floor(.05,1.45,-2.7,-2.4,'conc');

// ===== paredes, portas, janelas =====
const WM=mat(0xf2eee6);
function seg(a,b,f,hz,y0,y1,full){if(b-a<.02)return;box(hz?b-a:T,y1-y0,hz?T:b-a,WM,hz?(a+b)/2:f,(y0+y1)/2,hz?f:(a+b)/2);if(full)col(0,hz?a:f-T/2,hz?b:f+T/2,hz?f-T/2:a,hz?f+T/2:b)}
function wall(x1,z1,x2,z2,ds=[]){const hz=z1===z2,f=hz?z1:x1;let a=(hz?Math.min(x1,x2):Math.min(z1,z2))-T/2,b=(hz?Math.max(x1,x2):Math.max(z1,z2))+T/2,cur=a;
 ds.sort((p,q)=>p[0]-q[0]).forEach(([p,nm,dir,k,w=1])=>{const h0=p-w/2,h1=p+w/2,rc=[hz?h0:f-T/2,hz?h1:f+T/2,hz?f-T/2:h0,hz?f+T/2:h1];seg(cur,h0,f,hz,0,WH,1);cur=h1;

   const g=new THREE.Mesh(new THREE.BoxGeometry(hz?w:.04,1.2,hz?.04:w),glassM());g.position.set(hz?p:f,1.5,hz?f:p);sc.add(g);
   box(hz?w+.1:.1,.06,hz?.1:w+.1,0x333333,hz?p:f,.9,hz?f:p);box(hz?.05:.1,1.2,hz?.1:.05,0x333333,hz?p:f,1.5,hz?f:p);return}
  seg(h0,h1,f,hz,k==='g'?2.4:k==='b'?2.4:2.1,WH,0);
  const pv=new THREE.Group();pv.userData.door={nm,k,dir,t:0,tg:0,cur:0,w,p,f,hz};
  if(k==='d'){pv.position.set(hz?h0:f,0,hz?f:h0);box(hz?w:.06,2.1,hz?.06:w,0x7a4a26,hz?w/2:0,1.05,hz?0:w/2,pv);const hd=new THREE.Mesh(new THREE.SphereGeometry(.05),mat(0xd4af37));hd.position.set(hz?w-.15:.07,1.05,hz?.07:w-.15);pv.add(hd)}
  else if(k==='g'){pv.position.set(p,2.4,f);box(w-.04,2.4,.08,0xdcdcd8,0,-1.2,0,pv);for(let i=0;i<5;i++)box(w-.04,.04,.1,0x9a9a96,0,-.4-i*.45,0,pv)}
  else{pv.position.set(p,0,f+.2);box(w,2.3,.3,0x4a2f1a,0,1.15,0,pv);for(let r=0;r<4;r++){box(w,.04,.3,0x2e1c0e,0,.3+r*.55,.02,pv);for(let i=0;i<9;i++){const h=.25+Math.random()*.1;box(.07,h,.2,new THREE.Color().setHSL(Math.random(),.45,.4).getHex(),-w/2+.1+i*(w-.2)/8,.34+r*.55+h/2-.02,.03,pv,0)}}}

// casa
wall(-7,-4.5,8,-4.5,[[-5,'','','w',1.6],[6.2,'','','w',1.6]]);
wall(-7,4.5,8,4.5,[[-5.6,'','','w',1.6],[-3,'Porta da frente',1,'d'],[1,'','','w',2.6],[5.5,'','','w',2]]);

// ===== escada secreta e bunker =====

addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
const look=(dx,dy)=>{if(mode!=='walk'||paused||tw||ui)return;const s=.0022*S.sens;pl.yaw-=dx*s;pl.pit=clamp(pl.pit-dy*s,-1.45,1.45)};

 mv+=Math.abs(dx)+Math.abs(dy);if(mode==='walk'){if(document.pointerLockElement!==cv)look(dx*1.2,dy*1.2)}else if(mode==='ext'||mode==='intro'){if(e.buttons&2||e.shiftKey){const k=g.r*.0016,s=Math.sin(g.th),co=Math.cos(g.th);g.tx-=co*dx*k+s*dy*k;g.tz+=s*dx*k-co*dy*k}else{g.th-=dx*.006;g.ph=clamp(g.ph-dy*.006,.05,1.55)}}};

function drawMap(){const mc=$('mc'),x=mc.getContext('2d'),s=22,ox=-(-8.5)*s,oz=-(-11)*s,X=v=>v*s+ox,Z=v=>v*s+oz;x.clearRect(0,0,mc.width,mc.height);x.fillStyle='#15130f';x.fillRect(0,0,mc.width,mc.height);
 R.forEach(r=>{if(r.lv&&!found)return;x.fillStyle=r.lv?'rgba(120,60,50,.5)':'rgba(240,200,150,.16)';x.strokeStyle=r.lv?'#c0584a':'#f0a35e';x.lineWidth=2;if(r.lv)x.setLineDash([6,4]);else x.setLineDash([]);x.fillRect(X(r.x0),Z(r.z0),(r.x1-r.x0)*s,(r.z1-r.z0)*s);x.strokeRect(X(r.x0),Z(r.z0),(r.x1-r.x0)*s,(r.z1-r.z0)*s);
  if(r.i===9&&!found){}x.setLineDash([]);x.fillStyle='#f4efe6';x.font='11px system-ui';x.textAlign='center';if(!(r.i===9&&!found))x.fillText(r.n,X(r.cx),Z(r.cz)+4)});
 doors.forEach(d=>{const u=d.userData.door;if(u.k==='b'&&!found)return;x.strokeStyle=u.cur>.5?'#6ad06a':'#e8a050';x.lineWidth=3;x.beginPath();if(u.hz){x.moveTo(X(u.p-u.w/2),Z(u.f));x.lineTo(X(u.p+u.w/2),Z(u.f))}else{x.moveTo(X(u.f),Z(u.p-u.w/2));x.lineTo(X(u.f),Z(u.p+u.w/2))}x.stroke()});
 x.fillStyle='#f0a35e';x.beginPath();x.arc(X(pl.x),Z(pl.z),6,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(X(pl.x),Z(pl.z));x.lineTo(X(pl.x-Math.sin(pl.yaw)*1.2),Z(pl.z-Math.cos(pl.yaw)*1.2));x.stroke()}

// ===== loop =====
let last=0;
function walk(dt){
 const k=keys;let fx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0)+jx,fz=(k.w||k.arrowup?1:0)-(k.s||k.arrowdown?1:0)+jz;const L=Math.hypot(fx,fz);if(L>1){fx/=L;fz/=L}
 const run=k.shift&&!crouch?1:0,sp=(run?4.3:2.3)*(crouch?.55:1),sn=Math.sin(pl.yaw),cs=Math.cos(pl.yaw),a=1-Math.exp(-dt*(L?9:13));
 pl.vx=lerp(pl.vx,(-sn*fz+cs*fx)*sp,a);pl.vz=lerp(pl.vz,(-cs*fz-sn*fx)*sp,a);
 const nx=pl.x+pl.vx*dt,nz=pl.z+pl.vz*dt;if(!blocked(nx,pl.z,pl.lv))pl.x=nx;else pl.vx=0;if(!blocked(pl.x,nz,pl.lv))pl.z=nz;else pl.vz=0;
 const ty=gy();pl.y=lerp(pl.y,ty,1-Math.exp(-dt*16));if(pl.x>.05&&pl.x<1.45&&pl.z<-2.7&&pl.z>-5.3)pl.lv=pl.y<-1.2?1:0;if(pl.lv&&!found){found=true;say('rn','Você encontrou o bunker secreto',3500)}
 const spd=Math.hypot(pl.vx,pl.vz);pl.ph+=spd*dt*1.9;const st=Math.floor(pl.ph/Math.PI);if(st!==pl.st){pl.st=st;if(spd>.8)SND.step()}
 pl.eye=lerp(pl.eye,crouch?1.1:1.65,1-Math.exp(-dt*9));const amp=S.bob?clamp(spd/3.5,0,1):0,bx=Math.cos(pl.ph)*.018*amp,by=Math.sin(pl.ph*2)*.03*amp*(run?1.4:1);
 cam.position.set(pl.x+cs*bx,pl.y+pl.eye+by,pl.z-sn*bx);cam.rotation.set(pl.pit,pl.yaw,Math.sin(pl.ph)*.004*amp);
 const tf=S.fov+(run&&spd>3?7:0);if(Math.abs(cam.fov-tf)>.05){cam.fov=lerp(cam.fov,tf,.12);cam.updateProjectionMatrix()}
 const i=roomAt(pl.x,pl.z,pl.lv);if(i!==cur){cur=i;say('rn',i<0?'Área externa':R[i].n,2400)}
 if(fr%4===0){const o=aim(),p=$('prompt');let tx='';if(o){const u=o.userData;if(u.door)tx='E · '+(u.door.tg?'Fechar ':'Abrir ')+(u.door.nm||'');else if(u.sw!==undefined)tx='E · Luz: '+(R[u.sw].on?'apagar':'acender');else tx='E · '+(tvOn?'Desligar':'Ligar')+' TV'}p.textContent=tx;p.classList.toggle('on',!!tx&&!paused)}}
function orbit(dt){if(mode==='intro')g.th+=dt*.05;else if(!P.size)g.th+=dt*.02;for(const n in g)c[n]=lerp(c[n],g[n],1-Math.exp(-dt*(mode==='intro'?2:6)));orbPos(c,cam.position);if(mode==='intro'){cam.position.y+=Math.sin(t*.4)*.4;cam.position.x+=Math.sin(t*.27)*.3}cam.lookAt(c.tx,c.ty,c.tz);if(Math.abs(cam.fov-60)>.1){cam.fov=lerp(cam.fov,60,.05);cam.updateProjectionMatrix()}}
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000||.016,.05);last=now;t+=dt;fr++;
 if(tw){tw.t+=dt/tw.d;const e=sm(Math.min(tw.t,1));cam.position.lerpVectors(tw.p0,tw.p1,e);tmp.lerpVectors(tw.l0,tw.l1,e);cam.lookAt(tmp);const f=lerp(cam.fov,mode==='walk'||tw.cb?S.fov:60,.05);if(Math.abs(f-cam.fov)>.01){cam.fov=f;cam.updateProjectionMatrix()}if(tw.t>=1){const f=tw.cb;tw=null;f&&f()}}
 else if(mode==='walk'){if(!paused&&!ui)walk(dt);else if(ui==='map')drawMap()}else orbit(dt);
 doors.forEach(d=>{const u=d.userData.door;u.t=clamp(u.t+(u.tg?1:-1)*dt/(u.k==='d'?.9:u.k==='g'?2.4:1.8),0,1);u.cur=sm(u.t);if(u.k==='d')d.rotation.y=u.cur*1.6*u.dir;else if(u.k==='g')d.scale.y=Math.max(.04,1-u.cur*.96);else d.position.x=u.p+u.cur*(u.w+.25)});
 // iluminação: transição suave entre ambientes claros e escuros
 const lv=mode==='walk'||tw?pl.lv:0,inside=roomAt(cam.position.x,cam.position.z,lv)>=0&&lv===0&&mode==='walk';const zA=lv?.12:inside?.55:.85,zS=lv?0:inside?.8:1.05,k=1-Math.exp(-dt*3);

 R.forEach(r=>{r.b=lerp(r.b,r.on?1:0,1-Math.exp(-dt*8));r.lamp.material.emissiveIntensity=r.b});
 const px=cam.position.x,pz=cam.position.z,ps=R.filter(r=>r.b>.02).sort((a,b)=>((a.cx-px)**2+(a.cz-pz)**2+(a.lv!==lv)*900)-((b.cx-px)**2+(b.cz-pz)**2+(b.lv!==lv)*900));
 pool.forEach((l,j)=>{const r=ps[j];if(r){l.position.set(r.cx,r.lv?-.9:WH-.5,r.cz);l.color.set(r.lv?0xffb878:0xffd9a0);l.intensity=lerp(l.intensity,r.b*(r.lv?.9:1.15),.2)}else l.intensity=lerp(l.intensity,0,.2)});
 redL.intensity=lv?.7+Math.sin(t*3)*.5:0;
 if(window.TV){const m=window.TV.material;m.emissive.setRGB(...(tvOn?[.25+.2*Math.sin(t*2),.35+.2*Math.sin(t*1.3),.6]:[0,0,0]));m.emissiveIntensity=1}
